name: Tests

on:
  push:
  pull_request:

# A newer push to the same branch makes the check still running moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: Hermetic suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The path someone takes on a fresh machine, not a CI-only imitation of
      # it: .env from .env.dist, the image from the Dockerfile, the dependencies
      # installed inside it. Two suites boot the Symfony container and read
      # variables only docker-compose provides, so running PHP straight on the
      # runner would test a setup nobody uses. What passes here is what
      # `make install` gives someone who has just cloned the repository.
      - name: make install
        run: make install
        env:
          NO_PROMPT: 1
          # The legacy builder is a workaround for one laptop's daemon.
          BUILDKIT: 1

      # No network model is called: every suite runs against fakes.
      - name: make test
        run: make test

  host:
    name: Suites on the host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The PHP a host install runs with: static, musl-based, pinned by
      # checksum. Not the Docker image's — the two differ exactly where it
      # shows (GLOB_BRACE is missing, iconv does not transliterate), and this
      # is the one people run Sherpa with.
      # The pinned PHP and micro archives, kept between runs: the host they
      # come from has had passing 500s. Keyed on the Makefile, where the pins are.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/sherpa
            var/micro
          key: static-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: make php
        run: make php

      - name: composer install
        run: ~/.local/share/sherpa/php "$(command -v composer)" install --no-interaction --no-progress

      # Commands run in bubblewrap where it is installed: the sandbox suite
      # runs it for real here rather than skipping. The runner's AppArmor
      # keeps unprivileged user namespaces from the programs it does not know.
      - name: bubblewrap
        run: |
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # No compose here: every setting falls back on config/services.yaml,
      # which is precisely the path a host install takes.
      - name: suites
        run: ~/.local/share/sherpa/php tests/run.php
        env:
          SHERPA_REQUIRE_SANDBOX: 1

  # The Intel Mac's static PHP, checked on an Intel Mac at every push: the
  # release runs its executable there before publishing, and a tag is a bad
  # place to learn that the runner or the runtime is not what it should be.
  # `make php` refuses a PHP without what Sherpa needs.
  intel-mac:
    name: PHP on an Intel Mac
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/sherpa
            var/micro
          key: static-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: make php
        run: make php

      - name: runs Sherpa's own checks
        run: |
          ~/.local/share/sherpa/php -r 'exit(PHP_VERSION_ID >= 80400 && extension_loaded("pdo_sqlite") && extension_loaded("pcntl") && extension_loaded("phar") ? 0 : 1);'

      # sandbox-exec exists only here: the sandbox suite runs it for real.
      - name: composer install
        run: |
          command -v composer > /dev/null || brew install -q composer
          ~/.local/share/sherpa/php "$(command -v composer)" install --no-interaction --no-progress

      - name: sandbox
        run: ~/.local/share/sherpa/php tests/shell_sandbox_test.php
        env:
          SHERPA_REQUIRE_SANDBOX: 1

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # The installer and the doctor are shell, and the suites only run PHP:
      # without this, nothing checks them at all. Through make lint, which pins
      # the shellcheck version — the runner's own changes when GitHub updates
      # its images, and did not match the one used to check locally.
      - name: shellcheck
        run: make lint
